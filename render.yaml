services:
  - type: web
    name: schedurx-backend
    runtime: node
    plan: free
    region: ohio
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: "info"
      - key: TOOLS_API_KEY
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NETTU_BASE_URL
        sync: false
      - key: NETTU_API_KEY
        sync: false
      - key: NETTU_WEBHOOK_KEY
        sync: false
      - key: CLINIC_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Preferred over FIREBASE_PRIVATE_KEY on platforms whose env-loader
      # mangles literal \n sequences — takes precedence when both are set.
      - key: FIREBASE_PRIVATE_KEY_BASE64
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_TEAM_INVITE_CONTENT_SID
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: "21m00Tcm4TlvDq8ikWAM"
      - key: PATIENT_APP_BASE_URL
        sync: false
      - key: DASHBOARD_BASE_URL
        sync: false
      - key: PUBLIC_CORS_ALLOWED_ORIGIN
        sync: false
